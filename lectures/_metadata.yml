# Every .qmd in lectures/ is a revealjs deck with the ESE theme.
# A lecture file sets title, subtitle (Week n · date), author and content — nothing visual.
# Drawing on slides and on a blank board: our own plugin in _extensions/ese-board (C = draw, B = board).
# It replaces Quarto's chalkboard, which must stay off: both use the C and B keys.
revealjs-plugins:
  - ese-board

format:
  revealjs:
    theme: [default, ese.scss]
    width: 1280
    height: 720
    margin: 0.06
    slide-number: c/t
    footer: "[← Course site](../index.html) · Research & Quantitative Business Methods · ESE Florence"
    transition: fade
    transition-speed: fast
    controls: true
    progress: false
    hash: true
    history: false
    menu: false
    html-math-method: katex
    embed-resources: false
    toc: false
    center: false
    display: flex
    center-title-slide: false
    include-in-header: ../_fonts.html

title-slide-attributes:
  data-background-color: "#AF1F25"
  data-background-image: "/images/ese-logo-white.svg"
  data-background-size: "14%"
  data-background-position: "top 7% right 4%"
