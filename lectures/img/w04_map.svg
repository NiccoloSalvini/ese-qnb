<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<line x1="470" y1="300" x2="420" y2="300" stroke="#2471a3" stroke-width="2" opacity="0.7"/>
<line x1="420" y1="70" x2="420" y2="550" stroke="#2471a3" stroke-width="2" opacity="0.7"/>
<line x1="420" y1="70" x2="320" y2="70" stroke="#2471a3" stroke-width="2" opacity="0.7"/>
<line x1="420" y1="150" x2="320" y2="150" stroke="#2471a3" stroke-width="2" opacity="0.7"/>
<line x1="420" y1="230" x2="320" y2="230" stroke="#2471a3" stroke-width="2" opacity="0.7"/>
<line x1="420" y1="320" x2="320" y2="320" stroke="#2471a3" stroke-width="2" opacity="0.7"/>
<line x1="420" y1="410" x2="320" y2="410" stroke="#2471a3" stroke-width="2" opacity="0.7"/>
<line x1="420" y1="470" x2="320" y2="470" stroke="#2471a3" stroke-width="2" opacity="0.7"/>
<line x1="420" y1="550" x2="320" y2="550" stroke="#2471a3" stroke-width="2" opacity="0.7"/>
<line x1="770" y1="300" x2="950" y2="160" stroke="#AF1F25" stroke-width="2" opacity="0.7"/>
<line x1="770" y1="300" x2="950" y2="300" stroke="#AF1F25" stroke-width="2" opacity="0.7"/>
<line x1="770" y1="300" x2="950" y2="440" stroke="#AF1F25" stroke-width="2" opacity="0.7"/>
<rect x="470" y="254" width="300" height="92" rx="10" fill="#AF1F25"/>
<text x="620" y="292" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">Money has a date on it</text>
<text x="620" y="324" text-anchor="middle" fill="#CDBA80" font-size="17">euros with different dates cannot be added</text>
<text x="170" y="30" fill="#7f8c8d" font-size="15" letter-spacing="2" text-anchor="middle">THIS WEEK · 15 OCT</text>
<text x="1070" y="110" fill="#7f8c8d" font-size="15" letter-spacing="2" text-anchor="middle">NEXT WEEK · 22 OCT</text>
<text x="436" y="220" fill="#7f8c8d" font-size="13" transform="rotate(-90 436 220)" text-anchor="middle">each uses the one above</text>
<circle cx="420" cy="150" r="13" fill="#fff" stroke="#2471a3" stroke-width="2"/><text x="420" y="155" text-anchor="middle" fill="#2471a3" font-size="14" font-weight="700">A</text>
<circle cx="420" cy="320" r="13" fill="#fff" stroke="#2471a3" stroke-width="2"/><text x="420" y="325" text-anchor="middle" fill="#2471a3" font-size="14" font-weight="700">B</text>
<circle cx="420" cy="440" r="13" fill="#fff" stroke="#2471a3" stroke-width="2"/><text x="420" y="445" text-anchor="middle" fill="#2471a3" font-size="14" font-weight="700">C</text>
<circle cx="420" cy="550" r="13" fill="#fff" stroke="#2471a3" stroke-width="2"/><text x="420" y="555" text-anchor="middle" fill="#2471a3" font-size="14" font-weight="700">D</text>
<rect x="20.0" y="44" width="300" height="52" rx="8" fill="#fff" stroke="#2471a3" stroke-width="2"/>
<text x="170" y="66" text-anchor="middle" fill="#222" font-size="18" font-weight="700">Simple interest</text>
<text x="170" y="86" text-anchor="middle" fill="#7f8c8d" font-size="12.5">A = P(1+it) · a line, wk 1</text>
<rect x="20.0" y="124" width="300" height="52" rx="8" fill="#fff" stroke="#2471a3" stroke-width="2"/>
<text x="170" y="146" text-anchor="middle" fill="#222" font-size="18" font-weight="700">Compound interest</text>
<text x="170" y="166" text-anchor="middle" fill="#7f8c8d" font-size="12.5">A = P(1+i)^t · an exponential, wk 1</text>
<rect x="20.0" y="204" width="300" height="52" rx="8" fill="#fff" stroke="#2471a3" stroke-width="2"/>
<text x="170" y="226" text-anchor="middle" fill="#222" font-size="18" font-weight="700">More often → e</text>
<text x="170" y="246" text-anchor="middle" fill="#7f8c8d" font-size="12.5">(1+i/m)^mt → e^it · a limit, wk 2</text>
<rect x="20.0" y="294" width="300" height="52" rx="8" fill="#fff" stroke="#2471a3" stroke-width="2"/>
<text x="170" y="316" text-anchor="middle" fill="#222" font-size="18" font-weight="700">Effective rate</text>
<text x="170" y="336" text-anchor="middle" fill="#7f8c8d" font-size="12.5">EAR = (1+i/m)^m − 1 · same exponential, as a price</text>
<rect x="20.0" y="384" width="300" height="52" rx="8" fill="#fff" stroke="#2471a3" stroke-width="2"/>
<text x="170" y="406" text-anchor="middle" fill="#222" font-size="18" font-weight="700">Discounting</text>
<text x="170" y="426" text-anchor="middle" fill="#7f8c8d" font-size="12.5">PV = FV/(1+r)^t · the exponential backwards</text>
<rect x="20.0" y="444" width="300" height="52" rx="8" fill="#fff" stroke="#2471a3" stroke-width="2"/>
<text x="170" y="466" text-anchor="middle" fill="#222" font-size="18" font-weight="700">Annuity · perpetuity · growth</text>
<text x="170" y="486" text-anchor="middle" fill="#7f8c8d" font-size="12.5">C/r, CF₁/(r−g) · a geometric series, and its limit</text>
<rect x="20.0" y="524" width="300" height="52" rx="8" fill="#fff" stroke="#2471a3" stroke-width="2"/>
<text x="170" y="546" text-anchor="middle" fill="#222" font-size="18" font-weight="700">NPV and IRR</text>
<text x="170" y="566" text-anchor="middle" fill="#7f8c8d" font-size="12.5">Σ CF/(1+r)^t · a function of r, and its zero, wk 1</text>
<rect x="950.0" y="134" width="240" height="52" rx="8" fill="#fff" stroke="#AF1F25" stroke-width="2"/>
<text x="1070" y="156" text-anchor="middle" fill="#222" font-size="18" font-weight="700">Bond price</text>
<text x="1070" y="176" text-anchor="middle" fill="#7f8c8d" font-size="12.5">annuity + one lump sum · the same discounting</text>
<rect x="950.0" y="274" width="240" height="52" rx="8" fill="#fff" stroke="#AF1F25" stroke-width="2"/>
<text x="1070" y="296" text-anchor="middle" fill="#222" font-size="18" font-weight="700">Duration</text>
<text x="1070" y="316" text-anchor="middle" fill="#7f8c8d" font-size="12.5">−(1/P)·dP/dy · the derivative, wk 2</text>
<rect x="950.0" y="414" width="240" height="52" rx="8" fill="#fff" stroke="#AF1F25" stroke-width="2"/>
<text x="1070" y="436" text-anchor="middle" fill="#222" font-size="18" font-weight="700">Convexity</text>
<text x="1070" y="456" text-anchor="middle" fill="#7f8c8d" font-size="12.5">d²P/dy² · the second derivative: step 6, wk 3</text>
</svg>