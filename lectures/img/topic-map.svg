<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 100 980 310" width="980" height="310" font-family="'Source Sans 3','Source Sans Pro',-apple-system,Helvetica,Arial,sans-serif">
  <rect y="100" width="980" height="310" fill="#ffffff"/>

  <!-- spine -->
  <line x1="70" y1="238" x2="910" y2="238" stroke="#e6e2d8" stroke-width="3"/>

  <!-- week nodes -->
  <g>
    <circle cx="130" cy="238" r="27" fill="#AF1F25"/><text x="130" y="245" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <circle cx="300" cy="238" r="27" fill="#AF1F25"/><text x="300" y="245" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <circle cx="470" cy="238" r="27" fill="#AF1F25"/><text x="470" y="245" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <circle cx="660" cy="238" r="27" fill="#a8955a"/><text x="660" y="245" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <circle cx="830" cy="238" r="27" fill="#a8955a"/><text x="830" y="245" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  </g>

  <!-- above: what you learn -->
  <g font-size="13" fill="#363636" text-anchor="middle">
    <text x="130" y="186" font-weight="700">algebra</text>
    <text x="130" y="205" fill="#7a7f85">equations · logs</text>
    <text x="300" y="186" font-weight="700">the derivative</text>
    <text x="300" y="205" fill="#7a7f85">limits · slope</text>
    <text x="470" y="186" font-weight="700">the study</text>
    <text x="470" y="205" fill="#7a7f85">optimise · integrate</text>
    <text x="660" y="186" font-weight="700">money over time</text>
    <text x="660" y="205" fill="#7a7f85">interest · NPV</text>
    <text x="830" y="186" font-weight="700">bonds</text>
    <text x="830" y="205" fill="#7a7f85">duration · convexity</text>
  </g>

  <!-- the one question each week answers -->
  <g font-size="13" font-style="italic" fill="#a8955a" text-anchor="middle">
    <text x="130" y="140">"from how many</text><text x="130" y="157">do we stop losing?"</text>
    <text x="300" y="140">"is the next one</text><text x="300" y="157">worth making?"</text>
    <text x="470" y="140">"how many,</text><text x="470" y="157">and how fragile?"</text>
    <text x="660" y="140">"is this project</text><text x="660" y="157">worth doing?"</text>
    <text x="830" y="140">"what does a rate</text><text x="830" y="157">rise cost us?"</text>
  </g>

  <!-- below: what it is assessed by -->
  <g font-size="12" text-anchor="middle">
    <rect x="70" y="288" width="460" height="30" rx="3" fill="#fdf6f6" stroke="#e8cdce"/>
    <text x="300" y="308" fill="#AF1F25" font-weight="700">MIDTERM (25%) — study a cost, a revenue and a profit function</text>
    <rect x="70" y="326" width="460" height="30" rx="3" fill="#fdf6f6" stroke="#e8cdce"/>
    <text x="300" y="346" fill="#AF1F25" font-weight="700">FINAL, question 5 of 5 — the calculus question</text>
    <rect x="560" y="288" width="350" height="68" rx="3" fill="#fbfaf6" stroke="#e6e2d8"/>
    <text x="735" y="308" fill="#a8955a" font-weight="700">WEEKS 4–5 — financial mathematics</text>
    <text x="735" y="330" fill="#7a7f85">what every project and every bond decision rests on;</text>
    <text x="735" y="347" fill="#7a7f85">asked in the retake exam's multiple-choice block</text>
  </g>


  <text x="70" y="395" font-size="13" fill="#7a7f85">Weeks 6–10, <tspan font-weight="700" fill="#363636">Vincenzo Nardelli, PhD</tspan>: probability, distributions, regression.</text>
</svg>
