<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Errors linked in time, and the fix</title>
<!-- Time-series lab: monthly sales for 48 months, y_t = 100 + 1.5 t + u_t, u_t = phi u_{t-1} + e_t, e_t ~ N(0, 6).
     The shocks e_t are drawn once per sample (seeded mulberry32), so moving phi reshapes the same sample.
     Top: the series with the OLS trend line on t. Bottom: residuals over time, joined, with the zero line.
     Readouts: trend slope, R², lag-1 correlation of the residuals (Pearson, pairs (e_{t-1}, e_t)).
     Checkbox: fit y_t = a + b t + c y_{t-1} by OLS (3x3 normal equations, months 2–48) and show its residuals.
     Embedded as an <iframe class="app">; preset from the query string, e.g. w09_timeerrors.html?phi=0.8
     (also &lag=1 to start with the fix on, &seed=7) -->
<style>
  :root { --red:#AF1F25; --gold:#CDBA80; --goldink:#a8955a; --ink:#363636; --muted:#7a7f85; --rule:#e6e2d8; --paper:#faf9f6; --hit:#2471a3; --miss:#c0392b; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:"Source Sans 3","Source Sans Pro",-apple-system,Helvetica,Arial,sans-serif; color:var(--ink); background:#fff; }
  .wrap { display:grid; grid-template-columns: 300px 1fr; grid-template-rows: 1fr auto; height:100vh; }
  .panel { padding:12px 18px; border-right:1px solid var(--rule); overflow:hidden; font-size:18px; }
  .panel h3 { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--goldink); margin:10px 0 4px; }
  .panel h3:first-child { margin-top:0; }
  label.s { display:grid; grid-template-columns: 26px 1fr 58px; align-items:center; gap:8px; margin:4px 0; }
  label.s b { font-style:italic; font-size:20px; }
  label.s output { text-align:right; font-variant-numeric: tabular-nums; font-weight:600; font-size:20px; }
  input[type=range] { width:100%; height:26px; accent-color: var(--red); cursor:pointer; margin:0; }
  input[type=range]:focus-visible { outline:3px solid var(--gold); outline-offset:2px; border-radius:4px; }
  button { font:inherit; font-size:16px; font-weight:600; width:100%; padding:4px 10px; margin:3px 0; border-radius:6px; cursor:pointer; border:2px solid var(--red); background:#fff; color:var(--red); }
  button.primary { background:var(--red); color:#fff; }
  button:hover { filter:brightness(1.08); }
  button:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  label.tog { display:flex; align-items:center; gap:8px; font-size:16px; margin-top:6px; cursor:pointer; }
  label.tog input { width:18px; height:18px; accent-color:var(--goldink); margin:0; }
  label.tog input:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .eq { font-size:17px; white-space:nowrap; font-variant-numeric: tabular-nums; line-height:1.3; }
  .eq b { color:var(--red); font-size:20px; }
  table.probs { border-collapse:collapse; margin-top:4px; width:100%; font-variant-numeric: tabular-nums; }
  table.probs td { padding:2px 0; font-size:17px; white-space:nowrap; }
  table.probs td:first-child { color:var(--muted); }
  table.probs td:last-child { text-align:right; font-weight:700; padding-left:6px; }
  .lag { font-size:16px; color:var(--muted); margin-top:4px; }
  .lag b { display:block; font-size:22px; color:var(--red); font-variant-numeric: tabular-nums; }
  .lag b.ok { color:var(--hit); }
  .plot { position:relative; min-width:0; min-height:0; }
  svg { width:100%; height:100%; display:block; }
  .caption { grid-column: 1 / -1; border-top:1px solid var(--rule); padding:8px 18px; font-size:17px; color:var(--muted); background:var(--paper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .caption i { font-style:italic; }
  @media (max-width: 700px) { .wrap { grid-template-columns: 1fr; grid-template-rows: auto 70vh auto; height:auto; } .panel { border-right:0; border-bottom:1px solid var(--rule); } .caption { white-space:normal; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h3>How linked are the errors</h3>
    <label class="s"><b>φ</b><input id="phi" type="range" min="0" max="0.95" step="0.05" aria-label="phi, link between one month's error and the next"><output id="phio"></output></label>
    <button id="new" class="primary">New sample</button>
    <label class="tog"><input id="lag" type="checkbox"><span>add last month as a predictor</span></label>
    <h3>The fit</h3>
    <div class="eq" id="eq"></div>
    <table class="probs">
      <tr><td id="slab">trend slope</td><td id="slope"></td></tr>
      <tr><td><i>R</i>²</td><td id="r2"></td></tr>
      <tr><td>months used</td><td id="nm"></td></tr>
    </table>
    <h3>The residuals</h3>
    <div class="lag">today's error vs last month's:<b id="rl"></b></div>
  </div>
  <div class="plot"><svg id="sv" role="img" aria-label="Top: monthly sales with a straight trend line. Bottom: residuals over time joined by a line"></svg></div>
  <div class="caption" id="cap"></div>
</div>
<script>
const Q = new URLSearchParams(location.search);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const num = (k, d) => { const v = parseFloat(Q.get(k)); return Number.isFinite(v) ? v : d; };
const S = {
  phi: Math.round(clamp(num("phi", 0.8), 0, 0.95) * 20) / 20,
  lag: Q.get("lag") === "1",
  seed: (Math.round(num("seed", 20261123)) >>> 0),
};
const $ = id => document.getElementById(id);
const SVG = "http://www.w3.org/2000/svg";
const NT = 48, SD = 6;

// seeded PRNG (mulberry32) + Box–Muller for normal draws
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(S.seed);
function rnorm() { let u = 0; while (u === 0) u = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng()); }

let shocks = [];
const drawShocks = () => { shocks = []; for (let i = 0; i < NT; i++) shocks.push(SD * rnorm()); };
function series() {
  const y = []; let u = shocks[0] / Math.sqrt(1 - S.phi * S.phi);      // start from the stationary spread
  for (let t = 1; t <= NT; t++) { if (t > 1) u = S.phi * u + shocks[t - 1]; y.push(100 + 1.5 * t + u); }
  return y;
}

// OLS by the normal equations X'X beta = X'y (Gaussian elimination with pivoting)
function ols(X, y) {
  const k = X[0].length, A = [];
  for (let i = 0; i < k; i++) {
    const row = [];
    for (let j = 0; j < k; j++) { let s = 0; for (let r = 0; r < X.length; r++) s += X[r][i] * X[r][j]; row.push(s); }
    let s = 0; for (let r = 0; r < X.length; r++) s += X[r][i] * y[r]; row.push(s);
    A.push(row);
  }
  for (let c = 0; c < k; c++) {
    let p = c; for (let r = c + 1; r < k; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    [A[c], A[p]] = [A[p], A[c]];
    for (let r = 0; r < k; r++) if (r !== c) { const f = A[r][c] / A[c][c]; for (let j = c; j <= k; j++) A[r][j] -= f * A[c][j]; }
  }
  const beta = A.map((row, i) => row[k] / row[i]);
  const fitv = X.map(row => row.reduce((s, v, j) => s + v * beta[j], 0));
  const res = y.map((v, i) => v - fitv[i]);
  const my = y.reduce((s, v) => s + v, 0) / y.length;
  const ssr = res.reduce((s, v) => s + v * v, 0), sst = y.reduce((s, v) => s + (v - my) ** 2, 0);
  return { beta, fitv, res, r2: 1 - ssr / sst };
}
function corr(a, b) {
  const n = a.length, ma = a.reduce((s, v) => s + v, 0) / n, mb = b.reduce((s, v) => s + v, 0) / n;
  let sab = 0, saa = 0, sbb = 0;
  for (let i = 0; i < n; i++) { sab += (a[i] - ma) * (b[i] - mb); saa += (a[i] - ma) ** 2; sbb += (b[i] - mb) ** 2; }
  return sab / Math.sqrt(saa * sbb);
}
const lag1 = r => corr(r.slice(1), r.slice(0, -1));

function compute() {
  const y = series(), t = y.map((_, i) => i + 1);
  const trend = ols(t.map(v => [1, v]), y);
  const out = { y, t, trend };
  if (S.lag) {
    const L = ols(t.slice(1).map((v, i) => [1, v, y[i]]), y.slice(1));
    out.m = L; out.mt = t.slice(1);
  } else { out.m = trend; out.mt = t; }
  out.rl = lag1(out.m.res);
  return out;
}

const neg = s => s.replace("-", "−");
const f2 = v => neg(v.toFixed(2));
const sv = $("sv");
function el(tag, attrs, text) {
  const e = document.createElementNS(SVG, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
const niceStep = v => { const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; };
const tickLab = v => neg(String(Math.round(v * 100) / 100));

function frame(X0, X1, xst, Y0, Y1, yst, L, T, pw, ph, ylab, xlab, H) {
  const px = x => L + (x - X0) / (X1 - X0) * pw;
  const py = y => T + ph - (y - Y0) / (Y1 - Y0) * ph;
  for (let x = X0; x <= X1 + 1e-9; x += xst) {
    sv.appendChild(el("line", { x1: px(x), x2: px(x), y1: T, y2: T + ph, stroke: "#f0ede6", "stroke-width": 1 }));
    sv.appendChild(el("text", { x: px(x), y: T + ph + 18, "text-anchor": "middle", "font-size": 14, fill: "#7a7f85" }, tickLab(x)));
  }
  for (let y = Y0; y <= Y1 + 1e-9; y += yst) {
    sv.appendChild(el("line", { x1: L, x2: L + pw, y1: py(y), y2: py(y), stroke: "#f0ede6", "stroke-width": 1 }));
    sv.appendChild(el("text", { x: L - 10, y: py(y) + 5, "text-anchor": "end", "font-size": 14, fill: "#7a7f85" }, tickLab(y)));
  }
  sv.appendChild(el("line", { x1: L, x2: L + pw, y1: T + ph, y2: T + ph, stroke: "#9aa0a6", "stroke-width": 1.5 }));
  sv.appendChild(el("line", { x1: L, x2: L, y1: T, y2: T + ph, stroke: "#9aa0a6", "stroke-width": 1.5 }));
  sv.appendChild(el("text", { x: L + 6, y: T - 8, "font-size": 15, fill: "#7a7f85" }, ylab));
  if (xlab) sv.appendChild(el("text", { x: L + pw, y: H - 6, "text-anchor": "end", "font-size": 15, fill: "#7a7f85" }, xlab));
  return { px, py };
}

function draw(D) {
  const W = sv.clientWidth || 700, H = sv.clientHeight || 470;
  sv.setAttribute("viewBox", `0 0 ${W} ${H}`);
  while (sv.firstChild) sv.removeChild(sv.firstChild);
  const L = 56, R = 24, T1 = 24, GAP = 52, B = 44;
  const pw = W - L - R, avail = H - T1 - GAP - B;
  const h1 = Math.round(avail * 0.56), h2 = avail - h1, T2 = T1 + h1 + GAP;
  const ylo = Math.min(...D.y), yhi = Math.max(...D.y), yst = niceStep((yhi - ylo) / 4);
  const Y0 = Math.floor(ylo / yst) * yst, Y1 = Math.ceil(yhi / yst) * yst;
  const res = D.m.res, rm = Math.max(...res.map(Math.abs)) * 1.05;
  const rst = niceStep(rm / 3), RM = Math.ceil(rm / rst) * rst;
  const A = frame(0, NT, 6, Y0, Y1, yst, L, T1, pw, h1, "sales", null, H);
  const Bp = frame(0, NT, 6, -RM, RM, rst, L, T2, pw, h2, S.lag ? "residuals, with last month" : "residuals, trend only", "month", H);

  // top: series, trend line, and the fitted values with last month
  sv.appendChild(el("polyline", { points: D.y.map((v, i) => `${A.px(i + 1)},${A.py(v)}`).join(" "), fill: "none", stroke: "#c9ccd0", "stroke-width": 1.5 }));
  const b = D.trend.beta;
  sv.appendChild(el("line", { x1: A.px(0), x2: A.px(NT), y1: A.py(b[0]), y2: A.py(b[0] + b[1] * NT), stroke: "#363636", "stroke-width": 3 }));
  if (S.lag) sv.appendChild(el("polyline", { points: D.m.fitv.map((v, i) => `${A.px(D.mt[i])},${A.py(v)}`).join(" "), fill: "none", stroke: "#a8955a", "stroke-width": 2.5 }));
  D.y.forEach((v, i) => sv.appendChild(el("circle", { cx: A.px(i + 1), cy: A.py(v), r: 4, fill: "#AF1F25", stroke: "#fff", "stroke-width": 1 })));
  const lg = el("text", { x: L + pw, y: T1 - 8, "text-anchor": "end", "font-size": 14, "font-weight": 600 });
  lg.appendChild(el("tspan", { fill: "#363636" }, "— trend line"));
  if (S.lag) lg.appendChild(el("tspan", { fill: "#a8955a" }, "   — with last month"));
  sv.appendChild(lg);

  // bottom: residuals over time
  sv.appendChild(el("line", { x1: L, x2: L + pw, y1: Bp.py(0), y2: Bp.py(0), stroke: "#363636", "stroke-width": 2 }));
  sv.appendChild(el("polyline", { points: res.map((v, i) => `${Bp.px(D.mt[i])},${Bp.py(v)}`).join(" "), fill: "none", stroke: "#9aa0a6", "stroke-width": 1.2 }));
  res.forEach((v, i) => sv.appendChild(el("circle", { cx: Bp.px(D.mt[i]), cy: Bp.py(v), r: 4, fill: v >= 0 ? "#AF1F25" : "#2471a3", stroke: "#fff", "stroke-width": 1 })));
}

let D = null;
function sync() {
  D = compute();
  $("phi").value = S.phi; $("phio").textContent = S.phi.toFixed(2);
  $("lag").checked = S.lag;
  const b = D.m.beta, sg = v => (v < 0 ? "−" : "+");
  $("eq").innerHTML = S.lag
    ? `<i>ŷ</i> = <b>${f2(b[0])}</b> ${sg(b[1])} <b>${Math.abs(b[1]).toFixed(2)}</b> × <i>t</i><br>&nbsp;&nbsp;&nbsp;&nbsp;${sg(b[2])} <b>${Math.abs(b[2]).toFixed(2)}</b> × last month`
    : `<i>ŷ</i> = <b>${f2(b[0])}</b> ${sg(b[1])} <b>${Math.abs(b[1]).toFixed(2)}</b> × <i>t</i>`;
  $("slab").textContent = S.lag ? "slope on t, given last month" : "trend slope";
  $("slope").textContent = f2(b[1]);
  $("r2").textContent = D.m.r2.toFixed(3);
  $("nm").textContent = D.mt.length;
  $("rl").textContent = "r = " + f2(D.rl);
  $("rl").className = Math.abs(D.rl) < 0.3 ? "ok" : "";
  $("cap").textContent = S.lag ? "Last month in the model: the streaks are gone."
                       : Math.abs(D.rl) < 0.3 ? "No streaks: one error says little about the next. Independence looks fine."
                               : "Streaks in the residuals: one error tells you the next. Independence is broken.";
  draw(D);
}
$("phi").oninput = e => { S.phi = +e.target.value; sync(); };
$("lag").onchange = e => { S.lag = e.target.checked; sync(); };
$("new").onclick = () => { drawShocks(); sync(); };
addEventListener("resize", () => draw(D));
drawShocks(); sync();
</script>
</body>
</html>
