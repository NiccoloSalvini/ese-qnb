<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twelve test rides. How many buy?</title>
<!-- Binomial lab: n independent test rides, each buys with probability p. Bars of P(X = x) for
     x = 0..n, the mean np as a gold marker, one bar highlighted with P(X = x), P(X <= x), P(X >= x).
     Embedded in the deck as an <iframe class="app">; presets from the query string,
     e.g. w07_binomial.html?n=12&p=0.25&x=3 -->
<style>
  :root { --red:#AF1F25; --gold:#CDBA80; --goldink:#a8955a; --ink:#363636; --muted:#7a7f85; --rule:#e6e2d8; --paper:#faf9f6; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:"Source Sans 3","Source Sans Pro",-apple-system,Helvetica,Arial,sans-serif; color:var(--ink); background:#fff; }
  .wrap { display:grid; grid-template-columns: 300px 1fr; grid-template-rows: 1fr auto; height:100vh; }
  .panel { padding:16px 18px; border-right:1px solid var(--rule); overflow:hidden; font-size:18px; }
  .panel h3 { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--goldink); margin:16px 0 6px; }
  .panel h3:first-child { margin-top:0; }
  label.s { display:grid; grid-template-columns: 26px 1fr 58px; align-items:center; gap:8px; margin:6px 0; }
  label.s b { font-style:italic; font-size:20px; }
  label.s output { text-align:right; font-variant-numeric: tabular-nums; font-weight:600; font-size:20px; }
  input[type=range] { width:100%; height:28px; accent-color: var(--red); cursor:pointer; margin:0; }
  input[type=range]:focus-visible { outline:3px solid var(--gold); outline-offset:2px; border-radius:4px; }
  .mean { font-size:18px; margin-top:4px; }
  .mean b { color:var(--goldink); font-size:22px; font-variant-numeric: tabular-nums; }
  .xrow { display:flex; align-items:center; gap:8px; }
  .xrow b { font-style:italic; font-size:20px; }
  input[type=number] { width:76px; font:inherit; font-size:20px; font-weight:600; padding:4px 6px; border:2px solid var(--rule); border-radius:4px; color:var(--ink); text-align:center; }
  input[type=number]:focus { outline:none; border-color:var(--red); }
  table.probs { border-collapse:collapse; margin-top:8px; width:100%; font-variant-numeric: tabular-nums; }
  table.probs td { padding:4px 0; font-size:19px; white-space:nowrap; }
  table.probs td:first-child { color:var(--muted); }
  table.probs td:last-child { text-align:right; font-weight:700; min-width:70px; }
  table.probs tr.hi td { color:var(--red); }
  .hint { color:var(--muted); font-size:14px; line-height:1.3; margin-top:10px; }
  .plot { position:relative; min-width:0; min-height:0; }
  svg { width:100%; height:100%; display:block; }
  .caption { grid-column: 1 / -1; border-top:1px solid var(--rule); padding:8px 18px; font-size:17px; color:var(--muted); background:var(--paper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .caption i { font-style:italic; }
  rect.bar { cursor:pointer; }
  rect.bar:focus { outline:none; }
  rect.bar:focus-visible { stroke:var(--goldink); stroke-width:3; }
  @media (max-width: 700px) { .wrap { grid-template-columns: 1fr; grid-template-rows: auto 55vh auto; height:auto; } .panel { border-right:0; border-bottom:1px solid var(--rule); } .caption { white-space:normal; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h3>The setting</h3>
    <label class="s"><b>n</b><input id="n" type="range" min="1" max="30" step="1" aria-label="n, number of test rides"><output id="no"></output></label>
    <label class="s"><b>p</b><input id="p" type="range" min="0" max="1" step="0.01" aria-label="p, probability each ride buys"><output id="po"></output></label>
    <div class="mean">mean <i>np</i> = <b id="mean"></b></div>
    <h3>Pick a count</h3>
    <div class="xrow"><b>x =</b><input id="x" type="number" min="0" max="30" step="1" aria-label="x, chosen number of buyers"><span style="color:var(--muted);font-size:15px">or click a bar</span></div>
    <table class="probs">
      <tr class="hi"><td>P(X = <span class="xv"></span>)</td><td id="peq"></td></tr>
      <tr><td>P(X ≤ <span class="xv"></span>)</td><td id="ple"></td></tr>
      <tr><td>P(X ≥ <span class="xv"></span>)</td><td id="pge"></td></tr>
    </table>
    <div class="hint">← → on a bar moves the pick. Sliders: arrow keys.</div>
  </div>
  <div class="plot"><svg id="sv" role="img" aria-label="Bar chart of binomial probabilities"></svg></div>
  <div class="caption">Each ride buys with probability <i>p</i>, independently. <i>n</i> rides. The shape is the binomial.</div>
</div>
<script>
const Q = new URLSearchParams(location.search);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const num = (k, d) => { const v = parseFloat(Q.get(k)); return Number.isFinite(v) ? v : d; };
const S = { n: clamp(Math.round(num("n", 12)), 1, 30), p: clamp(num("p", 0.25), 0, 1), x: 0 };
S.x = clamp(Math.round(num("x", Math.round(S.n * S.p))), 0, S.n);
const $ = id => document.getElementById(id);
const SVG = "http://www.w3.org/2000/svg";

// log-gamma (Lanczos), so C(n,x) p^x (1-p)^(n-x) never overflows and tiny tails stay accurate
function lgamma(z) {
  const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (z < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * z)) - lgamma(1 - z);
  z -= 1; let a = c[0]; const t = z + g + 0.5;
  for (let i = 1; i < g + 2; i++) a += c[i] / (z + i);
  return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(a);
}
function pmf(n, p) {
  const out = new Array(n + 1);
  for (let x = 0; x <= n; x++) {
    if (p === 0) { out[x] = x === 0 ? 1 : 0; continue; }
    if (p === 1) { out[x] = x === n ? 1 : 0; continue; }
    const lc = lgamma(n + 1) - lgamma(x + 1) - lgamma(n - x + 1);
    out[x] = Math.exp(lc + x * Math.log(p) + (n - x) * Math.log1p(-p));
  }
  return out;
}
const f3 = v => v.toFixed(3);
const f4 = v => (v < 0.0005 && v > 0 ? "<.001" : v.toFixed(4).replace(/^0/, ""));

let probs = [];
const sv = $("sv");
function el(tag, attrs, text) {
  const e = document.createElementNS(SVG, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}

function draw() {
  const W = sv.clientWidth || 700, H = sv.clientHeight || 460;
  sv.setAttribute("viewBox", `0 0 ${W} ${H}`);
  while (sv.firstChild) sv.removeChild(sv.firstChild);
  const L = 56, R = 20, T = 34, B = 48;
  const pw = W - L - R, ph = H - T - B;
  const n = S.n;
  const ymax = Math.max(0.05, Math.ceil(Math.max(...probs) * 20) / 20);   // top of axis in steps of .05
  const px = x => L + (x + 0.5) / (n + 1) * pw;
  const py = y => T + ph - y / ymax * ph;
  const slot = pw / (n + 1), bw = Math.max(4, slot * 0.72);

  // grid and y axis
  const step = ymax > 0.5 ? 0.25 : ymax > 0.25 ? 0.1 : 0.05;
  for (let y = 0; y <= ymax + 1e-9; y += step) {
    sv.appendChild(el("line", { x1: L, x2: W - R, y1: py(y), y2: py(y), stroke: "#f0ede6", "stroke-width": 1 }));
    sv.appendChild(el("text", { x: L - 8, y: py(y) + 5, "text-anchor": "end", "font-size": 14, fill: "#7a7f85" }, y.toFixed(2).replace(/^0/, "")));
  }
  sv.appendChild(el("line", { x1: L, x2: W - R, y1: py(0), y2: py(0), stroke: "#9aa0a6", "stroke-width": 1.5 }));
  sv.appendChild(el("text", { x: L - 8, y: T - 12, "text-anchor": "end", "font-size": 14, fill: "#7a7f85" }, "P(X = x)"));

  // bars
  const labelEvery = n > 20 ? 2 : 1;
  for (let x = 0; x <= n; x++) {
    const hi = x === S.x;
    const r = el("rect", { class: "bar", x: px(x) - bw / 2, y: py(probs[x]), width: bw, height: Math.max(0, py(0) - py(probs[x])),
      fill: hi ? "#AF1F25" : "#d9b3b5", rx: 2, tabindex: hi ? 0 : -1, role: "button", "aria-label": `x = ${x}, probability ${f4(probs[x])}` });
    r.addEventListener("click", () => { S.x = x; sync(); });
    r.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") { S.x = clamp(S.x + 1, 0, n); sync(); sv.querySelector("rect.bar[tabindex='0']").focus(); e.preventDefault(); }
      if (e.key === "ArrowLeft") { S.x = clamp(S.x - 1, 0, n); sync(); sv.querySelector("rect.bar[tabindex='0']").focus(); e.preventDefault(); }
    });
    sv.appendChild(r);
    if (x % labelEvery === 0) sv.appendChild(el("text", { x: px(x), y: py(0) + 20, "text-anchor": "middle", "font-size": 15, fill: hi ? "#AF1F25" : "#7a7f85", "font-weight": hi ? 700 : 400 }, String(x)));
    if (hi) sv.appendChild(el("text", { x: px(x), y: py(probs[x]) - 7, "text-anchor": "middle", "font-size": 16, "font-weight": 700, fill: "#AF1F25", stroke: "#fff", "stroke-width": 4, "paint-order": "stroke" }, f4(probs[x])));
  }
  sv.appendChild(el("text", { x: L + pw / 2, y: H - 8, "text-anchor": "middle", "font-size": 15, fill: "#7a7f85" }, "x = number who buy"));

  // mean marker (gold)
  const m = n * S.p;                                  // the value m on the bar scale: bar x sits at (x + .5) slots
  const mxp = L + (m + 0.5) / (n + 1) * pw;
  sv.appendChild(el("line", { x1: mxp, x2: mxp, y1: T - 4, y2: py(0), stroke: "#CDBA80", "stroke-width": 3, "stroke-dasharray": "8 5" }));
  const lab = el("text", { x: mxp, y: T - 10, "text-anchor": "middle", "font-size": 17, "font-weight": 700, fill: "#a8955a" }, `mean np = ${f3(m).replace(/\.?0+$/, "")}`);
  // keep the label inside the plot
  const est = 9 * (10 + String(m).length);
  if (mxp - est / 2 < L) lab.setAttribute("text-anchor", "start"), lab.setAttribute("x", L);
  if (mxp + est / 2 > W - R) lab.setAttribute("text-anchor", "end"), lab.setAttribute("x", W - R);
  sv.appendChild(lab);
}

function sync() {
  S.x = clamp(S.x, 0, S.n);
  probs = pmf(S.n, S.p);
  $("n").value = S.n; $("no").textContent = S.n;
  $("p").value = S.p; $("po").textContent = S.p.toFixed(2).replace(/^0/, "");
  $("x").max = S.n; if (document.activeElement !== $("x")) $("x").value = S.x;
  $("mean").textContent = f3(S.n * S.p).replace(/\.?0+$/, "");
  let le = 0; for (let i = 0; i <= S.x; i++) le += probs[i];
  let ge = 0; for (let i = S.x; i <= S.n; i++) ge += probs[i];
  document.querySelectorAll(".xv").forEach(s => s.textContent = S.x);
  $("peq").textContent = f4(probs[S.x]);
  $("ple").textContent = f4(Math.min(1, le));
  $("pge").textContent = f4(Math.min(1, ge));
  draw();
}
$("n").oninput = e => { S.n = +e.target.value; sync(); };
$("p").oninput = e => { S.p = +e.target.value; sync(); };
$("x").oninput = e => { const v = parseInt(e.target.value, 10); if (Number.isFinite(v)) { S.x = clamp(v, 0, S.n); sync(); } };
$("x").onchange = e => { e.target.value = S.x; };
addEventListener("resize", draw);
sync();
</script>
</body>
</html>
