<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Residual check: which assumption breaks?</title>
<!-- Residual lab: five scenarios, ~30 points each, fitted by least squares.
     Top: scatter + least-squares line. Bottom: residuals y − ŷ against x (for "time", against month, joined).
       good    : y = 50 + 1.2x + N(0, 5)                      straight, equal spread, independent
       curve   : y = 40 + 0.35x² + N(0, 6), x in 0–30           linearity broken
       fan     : y = 50 + 1.2x + N(0, 0.1 + 1.2x)             equal spread broken
       outlier : 29 "good" points with x in 0–30 + one far point at x = 40, 75 below the line
       time    : x = month 1–36, y = 80 + 1.2 t + e_t, e_t = 0.95 e_{t−1} + N(0, 4)   independence broken
     Seeded PRNG (mulberry32). Embedded as an <iframe class="app">; preset from the query string,
     e.g. w09_residuals.html?case=fan  (case = good | curve | fan | outlier | time; also &seed=7) -->
<style>
  :root { --red:#AF1F25; --gold:#CDBA80; --goldink:#a8955a; --ink:#363636; --muted:#7a7f85; --rule:#e6e2d8; --paper:#faf9f6; --hit:#2471a3; --miss:#c0392b; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:"Source Sans 3","Source Sans Pro",-apple-system,Helvetica,Arial,sans-serif; color:var(--ink); background:#fff; }
  .wrap { display:grid; grid-template-columns: 330px 1fr; grid-template-rows: 1fr auto; height:100vh; }
  .panel { padding:12px 18px; border-right:1px solid var(--rule); overflow:hidden; font-size:20px; }
  .panel h3 { font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--goldink); margin:10px 0 4px; }
  .panel h3:first-child { margin-top:0; }
  .seg { display:grid; grid-template-columns:repeat(5, 1fr); border:2px solid var(--rule); border-radius:6px; overflow:hidden; }
  .seg label { text-align:center; font-size:18px; line-height:1.1; padding:9px 1px; cursor:pointer; color:var(--muted); }
  .seg input { position:absolute; opacity:0; width:0; height:0; }
  .seg input:checked + label { background:var(--red); color:#fff; font-weight:600; }
  .seg input:focus-visible + label { outline:3px solid var(--gold); outline-offset:-3px; }
  button { font:inherit; font-size:19px; font-weight:600; width:100%; padding:6px 10px; margin:3px 0; border-radius:6px; cursor:pointer; border:2px solid var(--red); background:#fff; color:var(--red); }
  button.primary { background:var(--red); color:#fff; }
  button:hover { filter:brightness(1.08); }
  button:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .eq { font-size:20px; white-space:nowrap; font-variant-numeric: tabular-nums; line-height:1.3; }
  .eq b { color:var(--red); font-size:23px; }
  table.probs { border-collapse:collapse; margin-top:2px; width:100%; font-variant-numeric: tabular-nums; }
  table.probs td { padding:2px 0; font-size:20px; white-space:nowrap; }
  table.probs td:first-child { color:var(--muted); }
  table.probs td:last-child { text-align:right; font-weight:700; padding-left:6px; }
  table.probs tr.hi td:last-child { color:var(--red); }
  .verdict { font-size:21px; line-height:1.3; font-weight:700; color:var(--red); background:#fbeeee; border-left:5px solid var(--red); padding:6px 9px; border-radius:4px; }
  .verdict b { color:var(--red); }
  .verdict.ok { color:var(--hit); background:#eaf2f8; border-left-color:var(--hit); }
  .todo { font-size:19px; line-height:1.3; }
  .hint { color:var(--muted); font-size:14px; line-height:1.3; margin-top:6px; }
  .plot { position:relative; min-width:0; min-height:0; }
  svg { width:100%; height:100%; display:block; }
  .caption { grid-column: 1 / -1; border-top:1px solid var(--rule); padding:8px 18px; font-size:19px; color:var(--muted); background:var(--paper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .caption i { font-style:italic; }
  @media (max-width: 700px) { .wrap { grid-template-columns: 1fr; grid-template-rows: auto 70vh auto; height:auto; } .panel { border-right:0; border-bottom:1px solid var(--rule); } .caption { white-space:normal; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h3>Scenario</h3>
    <div class="seg" role="radiogroup" aria-label="Scenario">
      <input type="radio" name="case" id="c_good" value="good"><label for="c_good">good</label>
      <input type="radio" name="case" id="c_curve" value="curve"><label for="c_curve">curve</label>
      <input type="radio" name="case" id="c_fan" value="fan"><label for="c_fan">fan</label>
      <input type="radio" name="case" id="c_outlier" value="outlier"><label for="c_outlier">outlier</label>
      <input type="radio" name="case" id="c_time" value="time"><label for="c_time">time</label>
    </div>
    <button id="new" class="primary">New sample</button>
    <h3>The line</h3>
    <div class="eq" id="eq"></div>
    <table class="probs">
      <tr class="hi"><td><i>R</i>²</td><td id="r2"></td></tr>
      <tr><td>points <i>n</i></td><td id="np"></td></tr>
    </table>
    <h3>The residuals say</h3>
    <div class="verdict" id="verdict"></div>
    <h3>What we do</h3>
    <div class="todo" id="todo"></div>
  </div>
  <div class="plot"><svg id="sv" role="img" aria-label="Top: scatter with least-squares line. Bottom: residuals against x with a zero line"></svg></div>
  <div class="caption">Residual = <i>y</i> − <i>ŷ</i>, what the line misses. A good model leaves residuals with no pattern around zero.</div>
</div>
<script>
const Q = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseFloat(Q.get(k)); return Number.isFinite(v) ? v : d; };
const CASES = ["good", "curve", "fan", "outlier", "time"];
const INFO = {
  good:    { ok: true, verdict: "Residuals: no pattern. Linearity, equal spread, independence look fine.", todo: "Nothing to fix: read the line." },
  curve:   { verdict: "Residuals bend: <b>Linearity</b> is broken.", todo: "Add <i>x</i>² or use a log." },
  fan:     { verdict: "Residuals fan out: <b>Equal spread</b> is broken.", todo: "Log of <i>y</i>, or robust standard errors." },
  outlier: { verdict: "One point pulls the line: check it, report with and without.", todo: "Check the data point." },
  time:    { verdict: "Residuals run in streaks: <b>Independence</b> is broken.", todo: "Add trend, season or last month as a predictor." },
};
const S = {
  kase: CASES.includes(Q.get("case")) ? Q.get("case") : "good",
  seed: (Math.round(num("seed", 20261123)) >>> 0),
  pts: [], flag: -1,
};
const $ = id => document.getElementById(id);
const SVG = "http://www.w3.org/2000/svg";
const N = 30;

// seeded PRNG (mulberry32) + Box–Muller for normal draws
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(S.seed);
function rnorm() { let u = 0; while (u === 0) u = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng()); }
const unif = (a, b) => a + (b - a) * rng();

function generate() {
  const k = S.kase, pts = []; S.flag = -1;
  if (k === "time") {
    let e = rnorm() * 4 / Math.sqrt(1 - 0.9025);
    for (let t = 1; t <= 36; t++) { if (t > 1) e = 0.95 * e + 4 * rnorm(); pts.push([t, 80 + 1.2 * t + e]); }
  } else if (k === "curve") {
    for (let i = 0; i < N; i++) { const x = unif(0, 30); pts.push([x, 40 + 0.35 * x * x + 6 * rnorm()]); }
  } else if (k === "fan") {
    for (let i = 0; i < N; i++) { const x = 1 + 39 * i / (N - 1); pts.push([x, 50 + 1.2 * x + (0.1 + 1.2 * x) * rnorm()]); }
  } else if (k === "outlier") {
    for (let i = 0; i < N - 1; i++) { const x = unif(0, 30); pts.push([x, 50 + 1.2 * x + 4 * rnorm()]); }
    pts.push([40, 50 + 1.2 * 40 - 75]); S.flag = N - 1;
  } else {
    for (let i = 0; i < N; i++) { const x = unif(0, 40); pts.push([x, 50 + 1.2 * x + 5 * rnorm()]); }
  }
  S.pts = pts;
}

function fit(pts) {
  const n = pts.length;
  let mx = 0, my = 0; for (const [x, y] of pts) { mx += x; my += y; } mx /= n; my /= n;
  let sxx = 0, sxy = 0, syy = 0;
  for (const [x, y] of pts) { sxx += (x - mx) ** 2; sxy += (x - mx) * (y - my); syy += (y - my) ** 2; }
  const b = sxy / sxx, a = my - b * mx;
  let ssr = 0; for (const [x, y] of pts) ssr += (y - a - b * x) ** 2;
  return { a, b, r2: 1 - ssr / syy };
}

const neg = s => s.replace("-", "−");
const f2 = v => neg(v.toFixed(2));
const f3 = v => neg(v.toFixed(3));
const sv = $("sv");
function el(tag, attrs, text) {
  const e = document.createElementNS(SVG, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
const niceStep = v => { const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; };
const tickLab = v => neg(String(Math.round(v * 100) / 100));

// one panel: axes, grid, ticks; returns the scales
function frame(X0, X1, xst, Y0, Y1, yst, L, T, pw, ph, ylab, xlab, H) {
  const px = x => L + (x - X0) / (X1 - X0) * pw;
  const py = y => T + ph - (y - Y0) / (Y1 - Y0) * ph;
  for (let x = X0; x <= X1 + 1e-9; x += xst) {
    sv.appendChild(el("line", { x1: px(x), x2: px(x), y1: T, y2: T + ph, stroke: "#f0ede6", "stroke-width": 1 }));
    sv.appendChild(el("text", { x: px(x), y: T + ph + 18, "text-anchor": "middle", "font-size": 17, fill: "#7a7f85" }, tickLab(x)));
  }
  for (let y = Y0; y <= Y1 + 1e-9; y += yst) {
    sv.appendChild(el("line", { x1: L, x2: L + pw, y1: py(y), y2: py(y), stroke: "#f0ede6", "stroke-width": 1 }));
    sv.appendChild(el("text", { x: L - 10, y: py(y) + 5, "text-anchor": "end", "font-size": 17, fill: "#7a7f85" }, tickLab(y)));
  }
  sv.appendChild(el("line", { x1: L, x2: L + pw, y1: T + ph, y2: T + ph, stroke: "#9aa0a6", "stroke-width": 1.5 }));
  sv.appendChild(el("line", { x1: L, x2: L, y1: T, y2: T + ph, stroke: "#9aa0a6", "stroke-width": 1.5 }));
  sv.appendChild(el("text", { x: L + 6, y: T - 8, "font-size": 18, "font-weight": 600, fill: "#363636" }, ylab));
  if (xlab) sv.appendChild(el("text", { x: L + pw, y: H - 6, "text-anchor": "end", "font-size": 18, fill: "#363636" }, xlab));
  return { px, py };
}

function draw() {
  const W = sv.clientWidth || 700, H = sv.clientHeight || 470;
  sv.setAttribute("viewBox", `0 0 ${W} ${H}`);
  while (sv.firstChild) sv.removeChild(sv.firstChild);
  const isT = S.kase === "time";
  const F = fit(S.pts);
  const L = 56, R = 24, T1 = 24, GAP = 52, B = 44;
  const pw = W - L - R, avail = H - T1 - GAP - B;
  const h1 = Math.round(avail * 0.58), h2 = avail - h1, T2 = T1 + h1 + GAP;

  // x range: shared by both panels
  let X0, X1, xst;
  if (isT) { X0 = 0; X1 = 36; xst = 6; }
  else { X0 = 0; X1 = { curve: 30, outlier: 45 }[S.kase] || 40; xst = 5; }
  // y range (top)
  const ys = S.pts.map(p => p[1]);
  let ylo = Math.min(...ys), yhi = Math.max(...ys);
  const yst = niceStep((yhi - ylo) / 4);
  const Y0 = Math.floor(ylo / yst) * yst, Y1 = Math.ceil(yhi / yst) * yst;
  // residuals (bottom), symmetric about zero
  const res = S.pts.map(([x, y]) => y - (F.a + F.b * x));
  const rm = Math.max(...res.map(Math.abs)) * 1.05;
  const rst = niceStep(rm / 3), RM = Math.ceil(rm / rst) * rst;

  const xlab = isT ? "month" : "x";
  const A = frame(X0, X1, xst, Y0, Y1, yst, L, T1, pw, h1, isT ? "sales" : "y", null, H);
  const Bp = frame(X0, X1, xst, -RM, RM, rst, L, T2, pw, h2, "residual  y − ŷ", xlab, H);

  // top: least-squares line (and the line without the far point)
  const clip = el("clipPath", { id: "cp" }); clip.appendChild(el("rect", { x: L, y: T1, width: pw, height: h1 })); sv.appendChild(clip);
  const g = el("g", { "clip-path": "url(#cp)" }); sv.appendChild(g);
  if (S.flag >= 0) {
    const F0 = fit(S.pts.filter((_, i) => i !== S.flag));
    g.appendChild(el("line", { x1: A.px(X0), x2: A.px(X1), y1: A.py(F0.a + F0.b * X0), y2: A.py(F0.a + F0.b * X1), stroke: "#9aa0a6", "stroke-width": 2.5, "stroke-dasharray": "7 5" }));
    const lg = el("text", { x: L + pw, y: T1 - 8, "text-anchor": "end", "font-size": 14, "font-weight": 600 });
    lg.appendChild(el("tspan", { fill: "#363636" }, "— with the point"));
    lg.appendChild(el("tspan", { fill: "#7a7f85" }, "   - - without it"));
    sv.appendChild(lg);
  }
  g.appendChild(el("line", { x1: A.px(X0), x2: A.px(X1), y1: A.py(F.a + F.b * X0), y2: A.py(F.a + F.b * X1), stroke: "#363636", "stroke-width": 4 }));
  S.pts.forEach(([x, y], i) => {
    sv.appendChild(el("circle", { cx: A.px(x), cy: A.py(y), r: 8, fill: "#AF1F25", stroke: "#fff", "stroke-width": 1.5 }));
    if (i === S.flag) sv.appendChild(el("circle", { cx: A.px(x), cy: A.py(y), r: 12, fill: "none", stroke: "#a8955a", "stroke-width": 2.5 }));
  });

  // bottom: residuals with zero line
  sv.appendChild(el("line", { x1: L, x2: L + pw, y1: Bp.py(0), y2: Bp.py(0), stroke: "#363636", "stroke-width": 2.5 }));
  if (isT) sv.appendChild(el("polyline", { points: S.pts.map(([x], i) => `${Bp.px(x)},${Bp.py(res[i])}`).join(" "), fill: "none", stroke: "#7a7f85", "stroke-width": 2.2 }));
  S.pts.forEach(([x], i) => {
    sv.appendChild(el("line", { x1: Bp.px(x), x2: Bp.px(x), y1: Bp.py(0), y2: Bp.py(res[i]), stroke: res[i] >= 0 ? "#AF1F25" : "#2471a3", "stroke-width": 3, opacity: .45 }));
    sv.appendChild(el("circle", { cx: Bp.px(x), cy: Bp.py(res[i]), r: 7, fill: res[i] >= 0 ? "#AF1F25" : "#2471a3", stroke: "#fff", "stroke-width": 1.2 }));
    if (i === S.flag) sv.appendChild(el("circle", { cx: Bp.px(x), cy: Bp.py(res[i]), r: 10, fill: "none", stroke: "#a8955a", "stroke-width": 2.5 }));
  });
}

function sync() {
  for (const c of CASES) $("c_" + c).checked = S.kase === c;
  const F = fit(S.pts), xn = S.kase === "time" ? "month" : "<i>x</i>";
  $("eq").innerHTML = `<i>ŷ</i> = <b>${f2(F.a)}</b> ${F.b < 0 ? "−" : "+"} <b>${Math.abs(F.b).toFixed(2)}</b> × ${xn}`;
  $("r2").textContent = f3(F.r2);
  $("np").textContent = S.pts.length;
  const I = INFO[S.kase];
  $("verdict").innerHTML = I.verdict; $("verdict").className = "verdict" + (I.ok ? " ok" : "");
  $("todo").innerHTML = I.todo;
  draw();
}
document.querySelectorAll("input[name=case]").forEach(r => r.onchange = e => { S.kase = e.target.value; rng = mulberry32(S.seed); generate(); sync(); });
$("new").onclick = () => { generate(); sync(); };
addEventListener("resize", draw);
generate(); sync();
</script>
</body>
</html>
